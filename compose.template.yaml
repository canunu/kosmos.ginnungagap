# ginnungagap - the Compose project that holds what runs directly in Docker
# Desktop on Kosmos. Today that is yggdrasil, the application edge.
#
# The registry has a project of its own, in kosmos.draupnir. It sits below this
# one rather than beside the edge: the cluster pulls from it too, and it must be
# running before anything here starts, which one project cannot express because
# Compose resolves every image before it creates any container.
#
# This is the template, not the artifact. `npm run build` resolves it against
# config/deployment.json and writes dist/compose.yaml, and that is what is
# deployed. It remains a valid compose file, so it can be run directly here
# during development with the variables supplied in the environment.
#
# Every deployment-specific value is a `${VAR:?}` placeholder: the image, the
# resource limits, and the two host roots the mounts hang off. Nothing in here
# names a path on Kosmos, which is what lets the test suites resolve it against
# directories they own.
#
# ---------------------------------------------------------------------------
# What belongs in these comments, and what does not.
#
# Here: why a line has the value it has, in a sentence or two, and a pointer to
# wherever the argument lives. Not here: the argument. Three places could hold
# it - this file, README.md, and the platform documentation in kosmos.bootstrap -
# and a fact kept in more than one of them is a fact that will eventually
# disagree with itself. Platform reasoning lives in kosmos.bootstrap. How to
# operate this repository lives in README.md. What survives here is what someone
# editing a line needs in order not to break it.
# ---------------------------------------------------------------------------
#
# No `version:` key: Compose v2 ignores it and warns when it is present.

# Set explicitly rather than inferred from the directory name, so container and
# network names survive the deployed directory being moved or renamed.
name: ginnungagap

services:
  # yggdrasil - the application edge. Terminates public TLS for canunu.me, serves
  # the site, and maps each published name onto the same name in the internal
  # zone, hades.kosmos.internal.
  #
  # Built and documented in kosmos.yggdrasil.
  yggdrasil:
    # An immutable git SHA tag, never `latest`, so a rollback is a one line change
    # to config/deployment.json and it is always possible to tell which build is
    # running. The `:?` form fails the build rather than producing an artifact
    # that starts something unintended, and because the value is resolved on a
    # development machine, an unset image is caught there rather than becoming a
    # container that will not start after a reboot.
    image: ${YGGDRASIL_IMAGE:?set yggdrasil.image in config/deployment.json, e.g. amalthea.hades.kosmos.internal:5000/yggdrasil:<git-sha>}

    # `missing` is what makes first bootstrap need no special handling: the first
    # image is built on Kosmos and is already local, and later, once brokk builds
    # it instead, the same setting pulls it. Safe because tags are immutable. See
    # "Bootstrapping" in
    # kosmos.bootstrap/docs/bare_metal/05_GinnungagapSetup.md.
    pull_policy: missing

    # A decision about who may start this container rather than about how it
    # recovers. atlas is the sole start authority, and `always` or
    # `unless-stopped` would let the daemon start it at every login having
    # checked nothing. Unbounded rather than `on-failure:3`, because a bounded
    # count leaves the edge down until the next login. See "atlas is the only
    # start authority" in kosmos.bootstrap/docs/bare_metal/07_KosmosStartup.md.
    restart: on-failure

    # No container_name, so the `ginnungagap-` prefix stays visible in `docker ps`.

    ports:
      # Loopback only, and a requirement rather than a preference: the listener
      # trusts a PROXY protocol header from any source, which is only safe because
      # nothing off-host can open the connection. Publishing on 0.0.0.0 would turn
      # that into client address spoofing. The unit suite asserts this.
      #
      # 8443 on both sides: the image runs unprivileged and cannot bind below
      # 1024, and hermes is configured to reach 8443. Port 8081 is the
      # container-local status listener, bound to the container's own loopback.
      - "127.0.0.1:8443:8443"

    volumes:
      # Mounted rather than built into the image, so rotating them is not a
      # rebuild. The certificate must be the full chain, not the leaf alone.
      #
      # The root is configured and ${HOME} is not used, so the account is never
      # inferred from whoever runs the project: the built artifact carries an
      # absolute path from config/deployment.json, and bringing it up from the
      # wrong account fails loudly instead of mounting the wrong material.
      #
      # The filenames are literal because the targets are. Those are the image's
      # contract, in kosmos.yggdrasil/conf/snippets, and the two have to
      # correspond — which is only visible with them written side by side.
      #
      # File mounts, and `create_host_path: false` on each: a missing source stops
      # the container with the path named. Without it Docker invents a directory
      # there, nginx reports a certificate it cannot read, and the directory has to
      # be removed by hand before the file can be restored.
      #
      # atlas writes these at every login from a keychain, and the mount is live:
      # remove a source and the file leaves the running container with it.
      - type: bind
        source: ${YGGDRASIL_HOST_CERT_ROOT:?}/canunu.me/canunu.me.fullchain.pem
        target: /etc/ssl/yggdrasil/canunu.me.fullchain.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${YGGDRASIL_HOST_CERT_ROOT:?}/canunu.me/canunu.me.key
        target: /etc/ssl/yggdrasil/canunu.me.key
        read_only: true
        bind:
          create_host_path: false

      # Not used to serve anything: it is what the edge verifies its internal
      # upstreams against.
      - type: bind
        source: ${YGGDRASIL_HOST_CERT_ROOT:?}/kosmos-local-ca/kosmos-local-ca.crt
        target: /etc/ssl/kosmos/kosmos-local-ca.crt
        read_only: true
        bind:
          create_host_path: false

      # The only writable bind mount, and this component's own directory rather than
      # the shared root above it: mounting that would give an Internet facing
      # process write access to every other component's files, including atlas's
      # session state. The unit suite asserts this root is never an ancestor of
      # anything mounted. atlas creates it at login, and a directory Docker invented
      # instead would have a mode nobody chose. It must be writable by uid 101; the
      # entrypoint checks and explains.
      - type: bind
        source: ${YGGDRASIL_HOST_LOG_ROOT:?}
        target: /var/log/yggdrasil
        bind:
          create_host_path: false

      # nginx needs a writable /tmp even with a read only root: the image
      # relocates its pid file and temp paths there precisely so the root can be
      # read only.
      #
      # Long form rather than the `tmpfs:` key because the size matters, and that
      # key takes paths only - options written there are silently ignored. The
      # size is a ceiling rather than an allocation.
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 268435456

    # Nothing writes outside the log mount and /tmp, which turns a compromise of
    # nginx from persistent into transient.
    read_only: true

    # Not even NET_BIND_SERVICE, which is why the image listens above 1024.
    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    # Runtime limits, not image properties: a Dockerfile describes an image and
    # cgroup constraints belong to whoever runs it.
    #
    # These are ceilings rather than reservations, so an over-large limit costs
    # nothing while one set too low OOM-kills the public edge. memory must stay
    # well clear of the tmpfs size above, because tmpfs pages are charged to this
    # cgroup - a limit near it turns "something filled /tmp" into "nginx was
    # OOM-killed", and nobody connects those while the site is down.
    #
    # `deploy.resources` rather than the `cpus` and `mem_limit` shorthands: it is
    # the canonical Compose Spec form and survives `docker compose config`.
    deploy:
      resources:
        limits:
          cpus: ${YGGDRASIL_CPU_LIMIT:?set yggdrasil.cpuLimit in config/deployment.json}
          memory: ${YGGDRASIL_MEMORY_LIMIT:?set yggdrasil.memoryLimit in config/deployment.json}

    # nginx's graceful shutdown. The SIGTERM Docker sends by default is its fast
    # shutdown, which drops connections in flight - visible to clients on every
    # deploy.
    stop_signal: SIGQUIT
    stop_grace_period: 30s

    # The image defines its own healthcheck against its status listener;
    # restating it here would create a second definition to keep in step.

    logging:
      # nginx writes both streams to files on the log mount, so stdout carries
      # only the startup banner and whatever goes wrong before nginx takes over:
      # tiny in normal operation, unbounded in a crash loop, which is what this
      # caps. The nginx logs themselves rotate under their own scheme.
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

    environment:
      # A policy knob, so changing it is a redeploy rather than a rebuild.
      # YGGDRASIL_LOG_DIR is fixed by the log mount above and set in the image; a
      # second copy here could disagree with it.
      YGGDRASIL_LOG_RETENTION_DAYS: ${YGGDRASIL_LOG_RETENTION_DAYS:?set yggdrasil.logRetentionDays in config/deployment.json}

    networks:
      - ginnungagap

networks:
  # With one network the project and the network are the same boundary, and a
  # second name would imply they can diverge. A project that later needs more
  # names the additional ones descriptively, `ginnungagap-internal` and so on.
  ginnungagap:
    name: ginnungagap
