# Deploys the project to Kosmos when what it deploys changes: the image reference
# in config/deployment.json, which is the approval to deploy, or the template.
# The same checks npm run deploy makes from a development machine run first, and
# a project that fails them is not deployed.
#
# Runs on talos, the forge's runner, as a host job: as typhon on Kosmos, so the
# deployment is a copy into ~/ginnungagap rather than scp. Node comes from this
# repository's mise.toml, which mise reads only once trusted.
name: deploy

on:
  push:
    branches: [main]
    paths:
      - config/deployment.json
      - compose.template.yaml

jobs:
  deploy:
    runs-on: kosmos
    steps:
      # The commit pushed, fetched from the forge with git. Not actions/checkout,
      # which is a Node action that host mode would run with whatever node is on
      # PATH, and which talos's PATH has none of; and not fetched from GitHub. The
      # job's token reaches git through its environment, not its arguments.
      - name: Check out
        env:
          JOB_TOKEN: ${{ gitea.token }}
        run: |
          auth=$(printf 'talos:%s' "$JOB_TOKEN" | base64)
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader GIT_CONFIG_VALUE_0="Authorization: Basic $auth"
          git init -q .
          git fetch -q --depth 1 "${{ gitea.server_url }}/${{ gitea.repository }}.git" "${{ gitea.sha }}"
          git checkout -q FETCH_HEAD

      - name: Node from mise.toml
        run: |
          mise trust --yes mise.toml
          mise install

      - name: Lint, test and build
        run: |
          mise exec -- npm ci --no-audit --no-fund
          mise exec -- npm run predeploy

      - name: Deploy
        run: cp dist/compose.yaml /Users/typhon/ginnungagap/compose.yaml

      - name: Bring up and wait for healthy
        working-directory: /Users/typhon/ginnungagap
        run: |
          docker compose up -d
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' ginnungagap-yggdrasil-1)
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker compose ps
          [ "$status" = healthy ]
